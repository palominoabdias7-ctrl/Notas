name: Crear APK Notas

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: unzip -q notas-proyecto.zip -d proyecto

      - name: Compilar APK y comprobar pruebas
        run: gradle -p proyecto/notas-android --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Preparar archivo
        run: cp proyecto/notas-android/app/build/outputs/apk/debug/app-debug.apk Notas.apk

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Notas-APK
          path: Notas.apk
          if-no-files-found: error
